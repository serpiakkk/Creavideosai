<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.15" filter="blur(30px)"/>

  <!-- Video Clapper / Play Emblem -->
  <g filter="url(#shadow)">
    <!-- Video Film Frame Outer -->
    <rect x="116" y="136" width="280" height="240" rx="36" fill="#1e2238" stroke="url(#accent)" stroke-width="8"/>
    
    <!-- Film Reel Perforations Top -->
    <rect x="146" y="156" width="28" height="20" rx="4" fill="#818cf8" opacity="0.8"/>
    <rect x="194" y="156" width="28" height="20" rx="4" fill="#818cf8" opacity="0.8"/>
    <rect x="242" y="156" width="28" height="20" rx="4" fill="#818cf8" opacity="0.8"/>
    <rect x="290" y="156" width="28" height="20" rx="4" fill="#818cf8" opacity="0.8"/>
    <rect x="338" y="156" width="28" height="20" rx="4" fill="#818cf8" opacity="0.8"/>

    <!-- Central Play Triangle with Gradient -->
    <polygon points="224,210 326,270 224,330" fill="url(#accent)"/>
    <polygon points="230,224 308,270 230,316" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- AI Sparks Star / Magic Wand Accent -->
  <g transform="translate(360, 110)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
  <g transform="translate(130, 390) scale(0.6)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#c084fc"/>
  </g>
</svg>
